# Publishes to PyPI when a version tag such as v0.1.0 is pushed.
#
# 1. test: checks the tag against the package version, runs the unit and conformance tests (with
#    the suite bundled in conformance/), then the live tests against the production API when the
#    PDFCONVERSIONAPI_KEY secret is set, and builds and checks the package.
# 2. publish: uploads that build to PyPI. It runs in the "pypi" environment, so it waits for a
#    reviewer's approval when the environment requires one.
#
# Uses PyPI trusted publishing: no token is stored in GitHub. Before the first release, add
# this repository and this workflow (release.yml, environment "pypi") as a trusted publisher of
# the "pdfconversionapi" project on PyPI.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      PDFCONVERSIONAPI_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      PDFCONVERSIONAPI_REQUIRE_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4 # runs the conformance suite's mock API
        with:
          node-version: "22"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/pdfconversionapi/_version.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Check that the conformance suite is in the repository
        run: |
          test -f conformance/cases.json && test -f conformance/mock-server.mjs || {
            echo "::error::conformance/ is missing: this repository keeps a copy of the shared test suite (https://github.com/pdfconversionapi/sdk-conformance) there"
            exit 1
          }
      - name: Install
        run: python -m pip install -e . pytest anyio build twine
      - name: Unit, conformance and README tests
        run: python -m pytest -q
      - name: Live tests against the production API
        env:
          PDFCONVERSIONAPI_KEY: ${{ secrets.PDFCONVERSIONAPI_KEY }}
          PDFCONVERSIONAPI_LIVE_BASE_URL: https://api.pdfconversionapi.com
        run: |
          if [ -z "$PDFCONVERSIONAPI_KEY" ]; then
            echo "::warning::The PDFCONVERSIONAPI_KEY secret is not set: live tests skipped."
            exit 0
          fi
          python -m pytest -q -m live tests/test_live.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pdfconversionapi/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
