[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pdfconversionapi"
dynamic = ["version"]
description = "Official Python client for the PDF Conversion API: convert documents, images and PDFs with one call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Zeel Shekhaliya" }]
keywords = ["pdf", "conversion", "docx to pdf", "pdf to jpg", "merge pdf", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.urls]
Homepage = "https://pdfconversionapi.com/docs"
Documentation = "https://pdfconversionapi.com/docs"
Repository = "https://github.com/pdfconversionapi/pdfconversionapi-python"
Issues = "https://github.com/pdfconversionapi/pdfconversionapi-python/issues"
Changelog = "https://github.com/pdfconversionapi/pdfconversionapi-python/blob/main/CHANGELOG.md"
Pricing = "https://pdfconversionapi.com/pricing"
Dashboard = "https://app.pdfconversionapi.com"

[tool.hatch.version]
path = "src/pdfconversionapi/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["tests/**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfconversionapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -p no:cacheprovider"
markers = [
    "live: runs against the real API (../conformance/.local-api.env, or PDFCONVERSIONAPI_LIVE_BASE_URL and PDFCONVERSIONAPI_KEY); select with -m live",
]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.format]
exclude = ["*.md"]  # the README keeps the quick start's aligned comments

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET"]
ignore = ["RET505", "RET506"]

